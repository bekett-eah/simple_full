<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect y=%2711%27 width=%2732%27 height=%277%27 rx=%273%27 fill=%27%230066FF%27/%3E%3Crect y=%2721%27 width=%2724%27 height=%277%27 rx=%273%27 fill=%27%231C1E4D%27/%3E%3C/svg%3E">
  <title>Trámite — Simple.sv</title>
  <meta name="description" content="Conoce un trámite de Simple.sv antes de iniciar sesión: qué te pedirá, cuánto cuesta y cuánto tarda.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" integrity="sha384-6p9AefaqUhEVheRlj1mpAkbngHXy9mbYMrIdcIt4Jlc9lOLIablJq3bBsLOjGwZ7" crossorigin="anonymous">

  <link rel="stylesheet" href="../src/styles/simple-light-vibrant.css">
  <script src="terminos.js" defer></script>

  <style>
    /* Trámite sin sesión · Simple.sv. Misma vista que tramite.html (banner, primer paso y resumen), pero el primer paso
       es solo una vista previa: para llenarlo hay que iniciar sesión, y de ahí se entra directo a tramite.html con los datos de la persona. */
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-family); font-size: 16px; line-height: 1.5; }
    img { max-width: 100%; display: block; }
    button, input { font: inherit; }
    .l2-wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    .l2-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Botones: un principal por pantalla, tamaño táctil de 44 px o más */
    .l2-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 20px; border-radius: var(--radius-pill); border: 1.5px solid transparent; font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; transition: background 0.2s, color 0.2s, border-color 0.2s; }
    .l2-btn-primary { background: var(--color-blue-primary); color: #FFFFFF; }
    .l2-btn-primary:hover { background: var(--color-blue-hover); }
    .l2-btn-outline { background: #FFFFFF; color: var(--color-blue-primary); border-color: var(--border-active); }
    .l2-btn-outline:hover { background: var(--color-blue-soft); }
    .l2-btn:focus-visible, .l2-link:focus-visible, .l2-tab:focus-visible, .l2-dot:focus-visible { outline: 3px solid var(--border-focus); outline-offset: 2px; }

    /* Encabezado */
    .l2-header { position: sticky; top: 0; z-index: 50; background: #F4F8FE; border-bottom: 1px solid var(--border-subtle); }
    .l2-header-inner { max-width: none; }
    .l2-header-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 68px; }
    .l2-logo { display: inline-flex; align-items: center; min-height: 44px; }
    .l2-logo svg { width: 110px; height: auto; }
    .l2-nav { display: none; flex: 1; justify-content: center; gap: 28px; }
    .l2-nav a { color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 15px; }
    .l2-nav a:hover { color: var(--color-blue-primary); }
    .l2-header-actions { display: flex; gap: 12px; align-items: center; }
    .l2-login { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 1.5px solid var(--border-active); border-radius: var(--radius-pill); background: #FFFFFF; color: var(--color-blue-primary); font-weight: 700; font-size: 15px; text-decoration: none; white-space: nowrap; transition: background 0.2s, color 0.2s, border-color 0.2s; }
    .l2-login:hover { background: var(--color-blue-soft); border-color: var(--color-blue-primary); }
    .l2-login-texto { display: none; }

    /* Catálogo */
    .l2-section { padding: 56px 0 8px; }
    .l2-section h2 { font-size: clamp(26px, 4vw, 34px); font-weight: 800; margin: 0 0 8px; }
    .l2-section > .l2-wrap > p { color: var(--text-secondary); margin: 0 0 24px; }
    .l2-catalog-intro {
      position: relative; isolation: isolate; overflow: hidden;
      width: 100vw; margin: 0 0 24px calc(50% - 50vw); padding: 26px max(28px, calc((100vw - 1168px) / 2));
      border-radius: var(--radius-card); background: linear-gradient(135deg, var(--color-navy-deep) 0%, var(--color-navy-deep) 65%, var(--color-blue-primary) 100%);
      color: #FFFFFF; box-shadow: var(--shadow-card);
    }
    /* El catálogo (banner, pestañas y tarjetas) ocupa siempre el 97% del ancho de la pantalla */
    #tramites > .l2-wrap { max-width: none; width: 97vw; padding: 0; }
    .l2-catalog-intro { width: 100%; margin-left: 0; margin-right: 0; padding-inline: max(28px, 3vw); }
    .l2-catalog-intro h1 { font-size: 1.5em; position: relative; z-index: 1; margin: 0 0 8px; color: #FFFFFF; text-shadow: 0 1px 14px rgba(10, 42, 140, 0.55); }
    .l2-catalog-intro p { position: relative; z-index: 1; margin: 0; max-width: 34ch; color: rgba(255, 255, 255, 0.86); text-shadow: 0 1px 12px rgba(10, 42, 140, 0.55); }

    /* ===== Animación de líneas del banner de Trámites =====
       Fondo vivo inspirado en Aura/n8n: líneas que fluyen y respiran,
       un rayo que recorre la curva principal y nodos que laten. */
    .l2-catalog-intro {
      --sky: #9FD8FF;
      --speed-flow: 18s; --speed-breath: 7.5s; --speed-node: 4.5s;
      --speed-bolt: 10s; --speed-glow: 2.4s;
      --line-opacity-min: 0.25; --line-opacity-max: 0.6; --line-opacity-static: 0.45;
      --node-halo: 0.35; --node-halo-hover: 0.85; --node-scale: 1.15;
      --decor-opacity: 0.5; --icon-opacity: 0.14; --hover-time: 600ms;
    }
    .l2-fondo-lineas { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; }
    .l2-linea {
      fill: none; stroke-width: 1.6; stroke-linecap: round;
      stroke-dasharray: var(--dash); opacity: var(--line-opacity-min);
      animation:
        l2-flujo   calc(var(--speed-flow)   * var(--flow-m))   linear                      infinite,
        l2-respira calc(var(--speed-breath) * var(--breath-m)) cubic-bezier(.37, 0, .63, 1) infinite;
      animation-delay: var(--d), var(--d);
    }
    @keyframes l2-flujo { from { stroke-dashoffset: 0; } to { stroke-dashoffset: calc(var(--period) * -1); } }
    @keyframes l2-respira { 0%, 100% { opacity: var(--line-opacity-min); } 50% { opacity: var(--line-opacity-max); } }
    .l2-rayo { fill: none; stroke-linecap: round; stroke-dasharray: 60 2000; stroke-dashoffset: 60; opacity: 0; animation: l2-rayo-mov var(--speed-bolt) infinite; }
    .l2-rayo-halo   { stroke: var(--sky); stroke-width: 12; opacity: 0; animation: l2-rayo-mov var(--speed-bolt) infinite, l2-brillo var(--speed-glow) ease-in-out infinite; }
    .l2-rayo-brillo { stroke: var(--sky); stroke-width: 5; }
    .l2-rayo-nucleo { stroke: #FFFFFF; stroke-width: 1.8; }
    @keyframes l2-rayo-mov {
      0%   { stroke-dashoffset: 60;    opacity: 0; animation-timing-function: ease-out; }
      15%  { stroke-dashoffset: 40;    opacity: 1; animation-timing-function: cubic-bezier(.45, 0, .55, 1); }
      36%  { stroke-dashoffset: -470;  opacity: 1; }
      56%  { stroke-dashoffset: -470;  opacity: 1; animation-timing-function: cubic-bezier(.45, 0, .55, 1); }
      90%  { stroke-dashoffset: -1000; opacity: 1; }
      98%  { stroke-dashoffset: -1020; opacity: 0; }
      100% { stroke-dashoffset: 60;    opacity: 0; }
    }
    @keyframes l2-brillo { 0%, 100% { stroke-width: 9; } 50% { stroke-width: 15; } }
    .l2-nodo { transform-box: fill-box; transform-origin: center; animation: l2-pulso var(--speed-node) ease-in-out infinite; }
    .l2-nodo-halo { opacity: var(--node-halo); transition: opacity var(--hover-time) ease; }
    .l2-nodo-nucleo { fill: #FFFFFF; }
    @keyframes l2-pulso { 0%, 100% { transform: scale(1); } 50% { transform: scale(var(--node-scale)); } }
    .l2-catalog-intro:hover .l2-nodo-halo { opacity: var(--node-halo-hover); }
    .l2-catalog-intro.l2-en-pausa .l2-linea,
    .l2-catalog-intro.l2-en-pausa .l2-rayo,
    .l2-catalog-intro.l2-en-pausa .l2-nodo { animation-play-state: paused; }
    @media (prefers-reduced-motion: reduce) {
      .l2-linea { animation: none; stroke-dasharray: none; opacity: var(--line-opacity-static); }
      .l2-rayo, .l2-rayo-halo { display: none; }
      .l2-nodo { animation: none; }
      .l2-nodo-halo { transition: none; }
    }

    /* Banner del trámite: institución, nombre y datos clave */
    .l2-catalog-intro .l2-tramite-inst { position: relative; z-index: 1; max-width: none; display: inline-flex; align-items: center; gap: 8px; margin: 0 0 10px; color: rgba(255, 255, 255, 0.86); font-size: 14px; font-weight: 700; }
    .l2-catalog-intro h1 { max-width: 22ch; }

    /* Formulario + resumen lateral */
    .l2-tramite { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
    .l2-form-card, .l2-resumen { min-width: 0; }
    .l2-form-card { padding: 24px; border: 1px solid var(--border-subtle); border-radius: var(--radius-card); background: #FFFFFF; box-shadow: var(--shadow-card); }
    .l2-paso-cab { display: flex; align-items: center; gap: 14px; padding-bottom: 20px; margin-bottom: 8px; border-bottom: 1px solid var(--border-subtle); }
    .l2-paso-num { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 48px; height: 48px; border-radius: 16px; background: var(--color-blue-primary); color: #FFFFFF; font-size: 15px; font-weight: 800; box-shadow: 0 8px 20px rgba(0, 102, 255, 0.25); }
    .l2-paso-cab h2, .l2-paso-cab h3 { margin: 0; color: var(--color-blue-primary); font-size: 22px; font-weight: 800; line-height: 1.2; }
    .l2-paso-cab p { margin: 2px 0 0; color: var(--text-secondary); font-size: 15px; }
    .l2-btn i { font-size: 18px; }

    /* Resumen del trámite */
    /* Columna de al lado: "Sobre este trámite" y, debajo, el desplegable de requisitos, detalles y leyes */
    .l2-lateral { display: grid; gap: 24px; align-content: start; min-width: 0; }
    .l2-resumen { padding: 22px; border: 1px solid var(--border-subtle); border-radius: var(--radius-card); background: var(--bg-subtle); }
    .l2-resumen h3 { margin: 0 0 6px; color: var(--color-blue-primary); font-size: 17px; font-weight: 800; }
    .l2-resumen > p { margin: 0; color: var(--text-secondary); font-size: 14px; text-align: justify; }
    .l2-resumen h3 { display: flex; align-items: center; gap: 12px; }
    .l2-resumen-icono { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 36px; height: 36px; border-radius: 12px; background: #FFFFFF; color: var(--color-blue-primary); font-size: 18px; }
    .l2-resumen dl { display: grid; gap: 14px; margin: 18px 0 0; }
    .l2-resumen dl > div { display: flex; align-items: flex-start; gap: 12px; }
    .l2-resumen dl i { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 36px; height: 36px; border-radius: 12px; background: #FFFFFF; color: var(--color-blue-primary); font-size: 18px; }
    .l2-resumen dt { color: var(--text-muted); font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
    .l2-resumen dd { margin: 0; color: var(--text-primary); font-size: 15px; font-weight: 700; }

    @media (min-width: 1000px) {
      .l2-tramite { grid-template-columns: minmax(0, 1fr) 340px; }
      .l2-lateral { position: sticky; top: 92px; }
      /* Con el desplegable abierto la columna puede ser más alta que la pantalla: deja de acompañar el scroll */
      .l2-lateral:has(.l2-info[open]) { position: static; }
      .l2-form-card { padding: 32px; }
    }

    .l2-footer { margin-top: 64px; padding: 28px 0 40px; border-top: 1px solid var(--border-subtle); color: var(--text-muted); font-size: 14px; }
    /* El pie ocupa el mismo ancho que el contenido, para que sus enlaces queden a la izquierda, bajo las tarjetas */
    .l2-footer > .l2-wrap { max-width: none; width: 97vw; padding: 0; }
    .l2-footer-enlaces { display: flex; flex-wrap: wrap; gap: 4px 22px; }
    .l2-footer-enlaces a, .l2-footer-enlaces button { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: none; color: var(--color-blue-primary); font: inherit; font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer; }
    .l2-footer-enlaces a:hover, .l2-footer-enlaces button:hover { text-decoration: underline; }
    .l2-footer-enlaces a:focus-visible, .l2-footer-enlaces button:focus-visible { outline: 3px solid var(--border-focus); outline-offset: 2px; border-radius: 6px; }

    @media (min-width: 720px) { .l2-logo svg { width: 132px; } }
    @media (min-width: 1000px) { .l2-nav { display: flex; } }
    @media (max-width: 560px) {
      .l2-profile-chevron { display: none; }
      .l2-profile-trigger > button { padding-right: 3px; }
    }

    .l2-seccion { margin: 32px 0 0; padding-top: 20px; border-top: 1px solid var(--border-subtle); color: var(--color-blue-primary); font-size: 18px; font-weight: 800; }
    .l2-nota { display: flex; gap: 14px; margin-top: 22px; padding: 16px 18px; border-radius: 18px; background: var(--color-blue-soft); color: var(--text-secondary); font-size: 15px; line-height: 1.55; }
    .l2-nota > i { flex-shrink: 0; color: var(--color-blue-primary); font-size: 24px; }
    .l2-nota-aviso { border: 1.5px solid #FCD34D; background: var(--color-amber-soft); }
    .l2-nota-aviso > i { color: var(--color-amber); }
    .l2-nota-requisitos { display: block; padding: 20px 22px; border: 1px solid var(--border-subtle); background: var(--bg-subtle); }
    .l2-nota-requisitos > i { display: none; }
    .l2-nota-cuerpo { min-width: 0; }
    .l2-nota-cuerpo strong.l2-nota-titulo { display: block; margin-bottom: 4px; color: var(--color-blue-primary); font-size: 16px; font-weight: 800; }
    .l2-nota-requisitos strong.l2-nota-titulo { font-size: 18px; }
    .l2-nota-cuerpo p, .l2-nota-cuerpo ul { margin: 0 0 8px; }
    .l2-nota-cuerpo p:last-child, .l2-nota-cuerpo ul:last-child { margin-bottom: 0; }
    .l2-nota-cuerpo ul { padding-left: 20px; }
    .l2-nota-cuerpo li { margin-bottom: 4px; }
    .l2-nota-cuerpo li::marker { color: var(--color-blue-primary); }
    .l2-nota-cuerpo h4 { margin: 18px 0 8px; color: var(--color-blue-sapphire); font-size: 14px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
    .l2-nota-requisitos .l2-nota-cuerpo { max-height: min(520px, 70vh); overflow-y: auto; padding-right: 8px; scrollbar-width: thin; scrollbar-color: #64748B transparent; }
    .l2-nota-requisitos .l2-nota-cuerpo::-webkit-scrollbar { width: 8px; }
    .l2-nota-requisitos .l2-nota-cuerpo::-webkit-scrollbar-thumb { border-radius: 8px; background: #64748B; }
    .l2-nota-requisitos .l2-nota-cuerpo:focus-visible { outline: 3px solid var(--border-focus); outline-offset: 4px; }
    .l2-no-disponible { padding: 40px 24px; border: 1.5px dashed var(--border-subtle); border-radius: var(--radius-card); text-align: center; color: var(--text-secondary); }
    .l2-no-disponible i { font-size: 40px; color: var(--border-active); }
    .l2-no-disponible .l2-btn { margin: 14px 6px 0; }
    .l2-no-disponible h3 { margin: 10px 0 6px; color: var(--color-blue-primary); font-size: 20px; }
    .l2-no-disponible p { margin: 0 0 18px; }

    /* Vista previa del primer paso: lo que pedirá el trámite, sin poder llenarlo hasta iniciar sesión */
    .l2-previa-chip { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; padding: 4px 12px; border-radius: var(--radius-pill); background: var(--color-blue-soft); color: var(--color-blue-primary); font-size: 13px; font-weight: 800; white-space: nowrap; }
    .l2-pide { display: grid; gap: 10px; margin: 22px 0 0; padding: 0; list-style: none; }
    .l2-pide li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border-subtle); border-radius: 16px; background: var(--bg-subtle); }
    .l2-pide li > i { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px; background: #FFFFFF; color: var(--color-blue-primary); font-size: 19px; }
    .l2-pide-texto { display: flex; flex: 1; flex-direction: column; min-width: 0; line-height: 1.35; }
    .l2-pide-texto strong { color: var(--text-primary); font-size: 15px; font-weight: 700; }
    .l2-pide-texto small { color: var(--text-muted); font-size: 13px; }
    .l2-pide-auto { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; padding: 3px 10px; border-radius: var(--radius-pill); background: var(--color-emerald-soft); color: var(--color-emerald); font-size: 12px; font-weight: 800; }
    .l2-pide-mas { margin: 12px 0 0; color: var(--text-muted); font-size: 14px; }
    /* Llamado a iniciar el trámite: única acción de la página */
    .l2-iniciar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-top: 28px; padding: 20px 22px; border-radius: 20px; background: linear-gradient(135deg, var(--color-navy-deep) 0%, var(--color-blue-primary) 100%); color: #FFFFFF; box-shadow: var(--shadow-card); }
    .l2-iniciar-texto { display: flex; gap: 12px; flex: 1 1 320px; min-width: 0; }
    .l2-iniciar-texto > i { flex-shrink: 0; font-size: 26px; color: #9FD8FF; }
    .l2-iniciar-texto strong { display: block; font-size: 17px; font-weight: 800; }
    .l2-iniciar-texto p { margin: 2px 0 0; color: rgba(255, 255, 255, 0.86); font-size: 14px; }
    .l2-iniciar .l2-btn { background: #FFFFFF; color: var(--color-blue-primary); }
    .l2-iniciar .l2-btn:hover { background: var(--color-blue-soft); }
    .l2-iniciar .l2-btn:focus-visible { outline-color: #FFFFFF; }
    /* Trámite sin formulario aquí: requisitos en la ficha oficial y cómo será el trámite */
    .l2-requisitos { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 16px; margin-top: 22px; padding: 18px; border: 1px solid var(--border-active); border-radius: 18px; background: var(--color-blue-soft); }
    .l2-requisitos-icono { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; background: var(--color-blue-primary); color: #FFFFFF; font-size: 22px; }
    .l2-requisitos-texto { flex: 1 1 260px; min-width: 0; }
    .l2-requisitos-texto strong { display: block; color: var(--color-blue-primary); font-size: 16px; font-weight: 800; }
    .l2-requisitos-texto p { margin: 2px 0 0; color: var(--text-secondary); font-size: 14px; line-height: 1.5; }
    .l2-requisitos .l2-btn { flex-shrink: 0; font-size: 15px; }
    .l2-sub { margin: 28px 0 0; color: var(--color-blue-primary); font-size: 16px; font-weight: 800; }
    .l2-pide-num { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px; background: #FFFFFF; color: var(--color-blue-primary); font-size: 15px; font-weight: 800; }
    @media (min-width: 1000px) { .l2-login-texto { display: inline; } }
    @media (max-width: 719px) {
      .l2-iniciar .l2-btn, .l2-requisitos .l2-btn { flex: 1 1 100%; }
      .l2-previa-chip { display: none; }
    }
  </style>
  <link rel="stylesheet" href="modulos.css">
</head>
<body>

  <!-- ENCABEZADO (sin sesión) -->
  <header class="l2-header">
    <div class="l2-wrap l2-header-inner">
      <a href="../index.html" class="l2-logo" aria-label="Simple.sv, inicio">
        <svg viewBox="0 0 252 57" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">

  <script>
    /* ===== Trámite sin sesión: datos del catálogo + vista previa del primer paso; Iniciar trámite pide la sesión ===== */
    const numero = Number(new URLSearchParams(location.search).get('n'));
    const tramite = (window.CATALOGO_TRAMITES || []).find(t => t.numero === numero);
    // El catálogo trae la descripción y la dependencia con punto final; aquí se muestran sin él
    if (tramite) ['descripcion', 'dependencia'].forEach(k => { if (tramite[k]) tramite[k] = tramite[k].replace(/(?<!\.)\.$/, ''); });
    const definicion = (window.FORMULARIOS_TRAMITES || {})[numero];
    const LOGIN = '../sitio-actual/login.html';

    // Crea un elemento con texto (textContent evita inyectar HTML)
    function el(tag, clase, texto) {
      const nodo = document.createElement(tag);
      if (clase) nodo.className = clase;
      if (texto !== undefined) nodo.textContent = texto;
      return nodo;
    }
    function icono(nombre) {
      const i = el('i', `ph ${nombre}`);
      i.setAttribute('aria-hidden', 'true');
      return i;
    }
    // Quita las notas entre *( )* que trae el catálogo
    const limpiarTexto = texto => (texto || '').replace(/\s*\*\([^)]*\)\*/g, '').trim();
    function costoCorto(texto) {
      const t = texto.toLowerCase();
      if (t.startsWith('no tiene costo') || t.includes('gratu')) return 'Gratis';
      const monto = texto.match(/\$\s?[\d.,]+/);
      return monto ? monto[0].replace(/\s/, '') : 'Ver costo';
    }

    // Banner y resumen: los mismos de tramite.html
    function pintarBanner() {
      document.title = `${tramite.nombre} — Simple.sv`;
      document.getElementById('tramite-institucion').textContent = tramite.institucion;
      document.getElementById('tramite-nombre').textContent = tramite.nombre;

      document.getElementById('resumen-descripcion').textContent = tramite.descripcion;
      const dl = document.getElementById('resumen-datos');
      [['ph-buildings', 'Dependencia', tramite.dependencia], ['ph-currency-dollar', 'Costo', limpiarTexto(tramite.costo)], ['ph-clock', 'Tiempo de respuesta', limpiarTexto(tramite.tiempo)], ['ph-users', 'Dirigido a', tramite.publico]]
        .filter(([, , valor]) => valor)
        .forEach(([nombre, titulo, valor]) => {
          const fila = el('div');
          const textos = el('div');
          const dd = el('dd');
          // Un costo con varios montos se muestra en líneas separadas
          limpiarTexto(valor).replace(/\.$/, '').split(titulo === 'Costo' ? /\s+(?=\$\d)/ : /\n/).forEach((parte, i) => {
            if (i) dd.append(el('br'));
            dd.append(parte);
          });
          textos.append(el('dt', '', titulo), dd);
          fila.append(icono(nombre), textos);
          dl.append(fila);
        });
    }

    // Notas del formulario (requisitos, avisos), igual que en tramite.html
    function crearNota(campo) {
      const caja = el('div', `l2-nota l2-nota-${campo.estilo || 'info'}`);
      caja.append(icono(campo.estilo === 'aviso' ? 'ph-warning' : 'ph-info'));
      const cuerpo = el('div', 'l2-nota-cuerpo');
      if (campo.titulo) cuerpo.append(el('strong', 'l2-nota-titulo', campo.titulo));
      let lista = null;
      (campo.lineas || []).forEach(linea => {
        if (linea.startsWith('- ')) {
          if (!lista) { lista = el('ul'); cuerpo.append(lista); }
          lista.append(el('li', '', linea.slice(2)));
          return;
        }
        lista = null;
        cuerpo.append(linea.startsWith('## ') ? el('h4', '', linea.slice(3)) : el('p', '', linea));
      });
      // Cuadro con scroll interno: alcanzable con teclado y con nombre
      if (campo.estilo === 'requisitos') {
        cuerpo.tabIndex = 0;
        cuerpo.setAttribute('role', 'region');
        cuerpo.setAttribute('aria-label', campo.titulo || 'Requisitos');
      }
      caja.append(cuerpo);
      return caja;
    }

    // Cada dato que pedirá el primer paso, sin poder llenarlo todavía
    const ICONO_CAMPO = { opciones: 'ph-list-checks', lista: 'ph-caret-circle-down', archivo: 'ph-paperclip', texto: 'ph-text-aa' };
    function datoQuePide(campo) {
      const li = el('li');
      li.append(icono(campo.soloLectura ? 'ph-lock-simple' : ICONO_CAMPO[campo.tipo] || 'ph-text-aa'));
      const texto = el('span', 'l2-pide-texto');
      const detalle = campo.tipo === 'opciones' ? campo.opciones.map(op => op.texto).join(' · ')
        : campo.tipo === 'lista' ? 'Eliges una opción de la lista'
        : campo.tipo === 'archivo' ? campo.ayuda || 'Adjuntas un archivo'
        : campo.ayuda || '';
      texto.append(el('strong', '', campo.etiqueta + (campo.opcional ? ' (opcional)' : '')));
      if (detalle) texto.append(el('small', '', detalle));
      li.append(texto);
      if (campo.soloLectura) {
        const auto = el('span', 'l2-pide-auto');
        auto.append(icono('ph-identification-card'), 'Con tu Identidad Digital');
        li.append(auto);
      }
      return li;
    }

    function pintarPrevia() {
      document.getElementById('paso-num').textContent = definicion.numero || '1';
      document.getElementById('paso-titulo').textContent = definicion.titulo;
      document.getElementById('paso-subtitulo').textContent = definicion.subtitulo || '';
      const contenedor = document.getElementById('campos');
      let lista = null;
      // Los campos que dependen de una respuesta ("si") se omiten: aparecen al llenar el trámite
      const condicionales = definicion.campos.filter(c => c.si).length;
      definicion.campos.filter(c => !c.si).forEach(campo => {
        if (campo.tipo === 'desplegable' || campo.tipo === 'finDesplegable' || campo.tipo === 'resumen') return;
        if (campo.tipo === 'nota' || campo.tipo === 'seccion') {
          contenedor.append(campo.tipo === 'nota' ? crearNota(campo) : el('h4', 'l2-seccion', campo.titulo));
          lista = null;
          return;
        }
        if (!lista) { lista = el('ul', 'l2-pide'); contenedor.append(lista); }
        lista.append(datoQuePide(campo));
      });
      if (condicionales) contenedor.append(el('p', 'l2-pide-mas', 'Según lo que respondas, el trámite puede pedirte algunos datos más'));
      const conDatos = definicion.campos.some(c => c.soloLectura || ['numero_de_documento', 'nombres', 'apellidos', 'nombre_de_solicitante', 'correo_notificaciones', 'correo_de_solicitante'].includes(c.nombre));
      if (conDatos) document.getElementById('iniciar-detalle').textContent = 'Inicia sesión con tu Identidad Digital y entrarás directo a este trámite, con tus datos ya completados donde el trámite los pida';
    }

    // Trámite sin formulario en el nuevo diseño: la información y la ficha oficial, con el mismo botón para iniciarlo
    function pintarSinFormulario() {
      document.getElementById('paso-num').replaceChildren(icono('ph-list-checks'));
      document.getElementById('paso-titulo').textContent = 'Antes de empezar';
      document.getElementById('paso-subtitulo').textContent = 'Revisa los requisitos y cómo será tu trámite';
      const contenedor = document.getElementById('campos');

      // Requisitos: todavía están solo en la ficha oficial
      const requisitos = el('div', 'l2-requisitos');
      const iconoRequisitos = el('span', 'l2-requisitos-icono');
      iconoRequisitos.append(icono('ph-clipboard-text'));
      const textoRequisitos = el('div', 'l2-requisitos-texto');
      textoRequisitos.append(el('strong', '', 'Requisitos'), el('p', '', 'Los requisitos detallados de este trámite están en su ficha oficial. Revísalos antes de empezar para tener todo a mano'));
      requisitos.append(iconoRequisitos, textoRequisitos);
      if (/^https?:\/\//i.test(tramite.enlace_simple || '')) {
        const ficha = el('a', 'l2-btn l2-btn-outline');
        ficha.href = tramite.enlace_simple;
        ficha.target = '_blank';
        ficha.rel = 'noopener noreferrer';
        ficha.append('Ver requisitos', icono('ph-arrow-up-right'));
        requisitos.append(ficha);
      }

      // Cómo será el trámite; el pago solo aparece si tiene costo
      const costo = costoCorto(tramite.costo);
      const pasos = [
        ['Inicia sesión', 'Con tu Identidad Digital'],
        ['Completa la solicitud', 'Tus datos de la Identidad Digital se llenan solos donde el trámite los pida'],
        costo !== 'Gratis' && ['Paga en línea', `${costo === 'Ver costo' ? 'Con' : `${costo} con`} tarjeta de crédito o débito`],
        ['Recibe tu documento', 'Sigue su avance en Mis documentos y descárgalo cuando esté listo']
      ].filter(Boolean);
      const lista = el('ol', 'l2-pide');
      pasos.forEach(([titulo, detalle], i) => {
        const li = el('li');
        const num = el('span', 'l2-pide-num', String(i + 1));
        num.setAttribute('aria-hidden', 'true');
        const texto = el('span', 'l2-pide-texto');
        texto.append(el('strong', '', titulo), el('small', '', detalle));
        li.append(num, texto);
        lista.append(li);
      });
      contenedor.append(requisitos, el('h3', 'l2-sub', 'Así será tu trámite'), lista);
    }

    if (!tramite) {
      // Enlace sin trámite válido: mensaje claro y vuelta al catálogo
      document.getElementById('tramite-institucion').parentElement.style.display = 'none';
      const contenedor = document.getElementById('tramite');
      contenedor.replaceChildren();
      const vacio = el('div', 'l2-no-disponible');
      const volver = el('a', 'l2-btn l2-btn-primary', 'Ver trámites');
      volver.href = '../index.html#ver-tramites';
      vacio.append(icono('ph-file-dashed'), el('h3', '', 'No encontramos este trámite'), el('p', '', 'Revisa el enlace o elige un trámite del catálogo'), volver);
      contenedor.append(vacio);
    } else {
      pintarBanner();
      pintarInformacionTramite(definicion?.informacion, document.getElementById('lateral'));
      if (definicion) pintarPrevia();
      else pintarSinFormulario();
      // Iniciar trámite (y el botón de la cabecera) pasan por el inicio de sesión y entran directo a este trámite
      const destino = `${LOGIN}?destino=tramite&n=${tramite.numero}`;
      document.getElementById('iniciar-tramite').href = destino;
      document.getElementById('login-cabecera').href = destino;
    }

    /* ===== Banner: pausa la animación de fondo si no está visible ===== */
    const catalogoIntro = document.getElementById('catalogo-intro');
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(([entrada]) => {
        catalogoIntro.classList.toggle('l2-en-pausa', !entrada.isIntersecting);
      }, { threshold: 0.05 }).observe(catalogoIntro);
    }
  </script>
</body>
</html>
