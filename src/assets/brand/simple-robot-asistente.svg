<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Asistente Simple.sv</title>
  <defs>
    <!-- Fondo: degradado oficial navy → azul de la cabecera nueva -->
    <linearGradient id="bg" x1="90" y1="60" x2="960" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C1E4D"/>
      <stop offset="0.6" stop-color="#1C1E4D"/>
      <stop offset="1" stop-color="#0066FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="540" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0066FF" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#1C53C0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1C1E4D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="512" y1="300" x2="512" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EEFC"/>
    </linearGradient>
    <linearGradient id="visor" x1="512" y1="400" x2="512" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C1E4D"/>
      <stop offset="1" stop-color="#253272"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FD8FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#9FD8FF" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blurSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="body"><path d="M356 742 H668 V800 Q668 868 600 868 H424 Q356 868 356 800 Z"/></clipPath>
    <clipPath id="icon"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>

  <g clip-path="url(#icon)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>

    <!-- Líneas y nodos de fondo (lenguaje de red del banner de trámites) -->
    <g stroke="url(#line)" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M-20 300 C 120 300, 150 210, 250 210"/>
      <path d="M-20 760 C 100 760, 140 860, 260 860"/>
      <path d="M1044 250 C 900 250, 880 340, 780 340" stroke="#9FD8FF" stroke-opacity="0.5"/>
      <path d="M1044 790 C 920 790, 900 880, 790 880" stroke="#9FD8FF" stroke-opacity="0.5"/>
    </g>
    <g fill="#9FD8FF">
      <circle cx="250" cy="210" r="9" fill-opacity="0.75"/>
      <circle cx="260" cy="860" r="9" fill-opacity="0.75"/>
      <circle cx="780" cy="340" r="9" fill-opacity="0.75"/>
      <circle cx="790" cy="880" r="9" fill-opacity="0.75"/>
    </g>

    <!-- Antena -->
    <rect x="496" y="196" width="32" height="130" rx="16" fill="#FFFFFF"/>
    <circle cx="512" cy="168" r="58" fill="#9FD8FF" opacity="0.55" filter="url(#blur)"/>
    <circle cx="512" cy="168" r="42" fill="#9FD8FF" opacity="0.4"/>
    <circle cx="512" cy="168" r="26" fill="#FFFFFF"/>

    <!-- Orejas -->
    <rect x="184" y="456" width="76" height="170" rx="38" fill="#0066FF"/>
    <rect x="764" y="456" width="76" height="170" rx="38" fill="#0066FF"/>
    <rect x="200" y="490" width="30" height="102" rx="15" fill="#9FD8FF" opacity="0.85"/>
    <rect x="794" y="490" width="30" height="102" rx="15" fill="#9FD8FF" opacity="0.85"/>

    <!-- Cuerpo con las dos barras del logotipo -->
    <path d="M356 742 H668 V800 Q668 868 600 868 H424 Q356 868 356 800 Z" fill="#FFFFFF"/>
    <g clip-path="url(#body)">
      <rect x="356" y="780" width="312" height="26" fill="#1C53C0"/>
      <rect x="356" y="822" width="312" height="26" fill="#0066FF"/>
    </g>

    <!-- Cabeza -->
    <rect x="232" y="318" width="560" height="430" rx="150" fill="url(#head)"/>

    <!-- Visera -->
    <rect x="290" y="392" width="444" height="272" rx="112" fill="url(#visor)"/>

    <!-- Ojos con brillo -->
    <g filter="url(#blurSm)" opacity="0.7" fill="#9FD8FF">
      <rect x="392" y="468" width="76" height="102" rx="38"/>
      <rect x="556" y="468" width="76" height="102" rx="38"/>
    </g>
    <rect x="394" y="470" width="72" height="98" rx="36" fill="#9FD8FF"/>
    <rect x="558" y="470" width="72" height="98" rx="36" fill="#9FD8FF"/>
    <circle cx="418" cy="498" r="14" fill="#FFFFFF"/>
    <circle cx="582" cy="498" r="14" fill="#FFFFFF"/>

    <!-- Sonrisa -->
    <path d="M458 606 Q512 646 566 606" stroke="#9FD8FF" stroke-width="20" stroke-linecap="round" fill="none"/>

    <!-- Mejillas -->
    <circle cx="332" cy="612" r="16" fill="#0066FF" opacity="0.9"/>
    <circle cx="692" cy="612" r="16" fill="#0066FF" opacity="0.9"/>
  </g>
</svg>
